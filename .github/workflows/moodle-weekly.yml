name: Daily Moodle to Notion Sync

on:
  schedule:
    # Every day at 07:00 UTC — adjust to your timezone/preference.
    - cron: "0 7 * * *"
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r moodle-deadline-agent/requirements.txt

      - name: Fetch Moodle deadlines and sync into Notion
        env:
          MOODLE_URL: ${{ secrets.MOODLE_URL }}
          MOODLE_USERNAME: ${{ secrets.MOODLE_USERNAME }}
          MOODLE_PASSWORD: ${{ secrets.MOODLE_PASSWORD }}
          MOODLE_TOKEN: ${{ secrets.MOODLE_TOKEN }}
          MOODLE_SERVICE: ${{ secrets.MOODLE_SERVICE }}
          LOOKAHEAD_DAYS: ${{ secrets.LOOKAHEAD_DAYS }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: |
          python moodle-deadline-agent/agent.py --json | python moodle-deadline-agent/notion_sync.py
